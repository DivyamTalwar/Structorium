# Exclude intentional fake-secret fixtures used by the secret-detector test suite.
# Keep this list as narrow as possible so real leaks elsewhere still surface.
paths-ignore:
  - ".gitleaks.toml"
  - "tests/detectors/security/test_rules.py"
  - "tests/detectors/security/test_security.py"
  - "tests/detectors/test_security_internals.py"
  - "tests/detectors/test_security_patterns.py"
  - "tests/e2e/test_cli_flags.py"
  - "tests/e2e/test_config_mutations.py"
  - "tests/e2e/test_core_commands.py"
  - "tests/e2e/test_scan_workflow.py"
