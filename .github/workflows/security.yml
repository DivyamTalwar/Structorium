name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  dependency-review:
    if: >
      github.event_name == 'pull_request' &&
      (
        github.event.repository.private == false ||
        vars.ENABLE_PRIVATE_DEPENDENCY_REVIEW == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@v4

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies for audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[full]"
          python -m pip freeze --exclude-editable > .pip-audit-requirements.txt
          python -m pip install pip-audit
      - name: Run pip-audit
        run: pip-audit --strict --progress-spinner off -r .pip-audit-requirements.txt

  codeql:
    if: >
      github.event.repository.private == false ||
      vars.ENABLE_PRIVATE_CODEQL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
